version: '3.8'

networks:
  localconnect:
    driver: bridge

volumes:
  postgres-data:
  redis-data:

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    container_name: localconnect-postgres
    image: 'postgres:15-alpine'
    command: postgres -c max_connections=200
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-localconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME:-localconnect}
      PGDATA: /var/lib/postgresql/data/db
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data:delegated
    networks:
      - localconnect
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-localconnect}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cache & Queue
  # ============================================
  redis:
    container_name: localconnect-redis
    image: 'redis:7-alpine'
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    ports:
      - '${REDIS_PORT:-6374}:6379'
    volumes:
      - redis-data:/data
    networks:
      - localconnect
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # pgAdmin (Development Only)
  # ============================================
  pgadmin:
    container_name: localconnect-pgadmin
    image: 'dpage/pgadmin4:latest'
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@localconnect.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    networks:
      - localconnect
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    depends_on:
      - postgres
    restart: unless-stopped

  # ============================================
  # Redis Commander (Development Only)
  # ============================================
  redis-commander:
    container_name: localconnect-redis-commander
    image: 'rediscommander/redis-commander:latest'
    environment:
      REDIS_HOSTS: local:redis:6379${REDIS_PASSWORD:+:$REDIS_PASSWORD}
    networks:
      - localconnect
    ports:
      - '${REDIS_COMMANDER_PORT:-8081}:8081'
    depends_on:
      - redis
    restart: unless-stopped
    profiles:
      - dev-tools

